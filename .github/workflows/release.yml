name: release

# After CI succeeds on main, create at most one tag for the unreleased
# conventional commits. The tag is then built by the shared GoReleaser
# workflow at its exact commit.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      !contains(github.event.workflow_run.head_commit.message, '[release=skip]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compute the next release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -n "$latest" ]; then
            range="${latest}..HEAD"
          else
            range="HEAD"
          fi

          minor=false
          patch=false
          while IFS= read -r commit; do
            subject=$(git log -1 --format=%s "$commit")
            body=$(git log -1 --format=%b "$commit")

            # A breaking change is a v0.x minor release.
            if grep -Eq '^[[:alpha:]]+(\([^)]+\))?!:' <<<"$subject" || grep -Eiq '^BREAKING[ -]CHANGE:' <<<"$body"; then
              minor=true
              continue
            fi

            type=${subject%%(*}
            type=${type%%:*}
            type=${type%%!*}
            type=$(tr '[:upper:]' '[:lower:]' <<<"$type")
            case "$type" in
              feat) minor=true ;;
              fix|perf|refactor|build|chore|ci) patch=true ;;
              docs|test|style) ;;
              *) ;;
            esac
          done < <(git rev-list "$range")

          if [ "$minor" != true ] && [ "$patch" != true ]; then
            echo "No releasable conventional commits since ${latest:-the repository start}."
            exit 0
          fi

          # The renamed project starts a new public release line at v0.1.0.
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            version=${latest#v}
            IFS=. read -r major minor_version patch_version <<<"$version"
            if [ "$minor" = true ]; then
              next="v${major}.$((minor_version + 1)).0"
            else
              next="v${major}.${minor_version}.$((patch_version + 1))"
            fi
          fi

          echo "Creating $next from $range"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create and push the tag
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "release $TAG"
          git push origin "$TAG"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: bnema/gh-actions/.github/workflows/go-release.yml@main
    with:
      go-version: "1.26"
      # The reusable workflow fetches tags before this command, ensuring
      # GoReleaser produces artifacts and notes for the newly created tag.
      pre-command: git checkout --detach "${{ needs.tag.outputs.tag }}"
