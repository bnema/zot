version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly

linters:
  default: standard
  # Temporarily defer the existing unchecked-return backlog.
  disable:
    - errcheck

formatters:
  enable:
    - gofmt

issues:
  # Run the same complete analysis locally and in CI, regardless of Git history depth.
  max-issues-per-linter: 0
  max-same-issues: 0
